<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FAQ Tool</title>

<style>
body{font-family:Arial;padding:20px;max-width:900px;margin:auto}
textarea,input{width:100%;margin:10px 0;padding:10px}
button{padding:10px 15px}
.output{background:#111;color:#0f0;padding:15px;white-space:pre-wrap;margin-top:20px}
</style>

</head>
<body>

<h2>FAQ + Schema</h2>

<input id="brand" placeholder="Brand">
<input id="product" placeholder="Product">

<textarea id="spec" rows="3" placeholder="Spec"></textarea>

<textarea id="faq" rows="8" placeholder="FAQ:
1. Câu hỏi?
Trả lời"></textarea>

<button onclick="run()">Generate</button>

<div id="out" class="output"></div>

<script>

function parseFAQ(text){
  const lines = text.split("\n");
  const faqs=[];
  let q="",a="";

  lines.forEach(line=>{
    line=line.trim();
    if(line.includes("?")){
      if(q && a) faqs.push({q,a});
      q=line.replace(/^\d+\.\s*/,"");
      a="";
    }else if(line){
      a+=line+" ";
    }
  });

  if(q && a) faqs.push({q,a});
  return faqs;
}

function run(){

  const brand=document.getElementById("brand").value;
  const product=document.getElementById("product").value;
  const spec=document.getElementById("spec").value;
  const raw=document.getElementById("faq").value;

  const source=parseFAQ(raw);

  const gen=[
    {q: product+" có đáng mua không?", a: product+" đáng cân nhắc nhờ "+spec},
    {q: product+" có phù hợp phòng khách không?", a:"Phù hợp không gian phòng khách."},
    {q: product+" chạy có mượt không?", a:"Hoạt động ổn định."},
    {q: product+" có gì nổi bật?", a:"Có công nghệ nổi bật trong phân khúc."},
    {q: "Mua "+product+" ở đâu uy tín?", a:"Mua tại "+brand+" để đảm bảo chính hãng."}
  ];

  let html="";
  gen.forEach(f=>{
    html+=`<div class="faq-generated">
<h4><strong>${f.q}</strong></h4>
<p>${f.a}</p>
</div>\n`;
  });

  const schema={
    "@context":"https://schema.org",
    "@type":"FAQPage",
    "mainEntity":[]
  };

  [...source,...gen].forEach(f=>{
    schema.mainEntity.push({
      "@type":"Question",
      "name":f.q,
      "acceptedAnswer":{
        "@type":"Answer",
        "text":f.a
      }
    });
  });

  const schemaStr=`<script type="application/ld+json">
${JSON.stringify(schema,null,2)}
</script>`;

  document.getElementById("out").textContent =
    "HTML FAQ MỚI:\n\n"+html+"\nSCHEMA:\n\n"+schemaStr;

}

</script>

</body>
</html>
