<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FAQ AEO Tool</title>
<style>
body{font-family:Arial;padding:20px;max-width:1000px;margin:auto}
textarea,input{width:100%;margin:10px 0;padding:10px}
button{padding:10px 15px;margin:5px}
.output{background:#111;color:#0f0;padding:15px;white-space:pre-wrap;margin-top:20px}
</style>
</head>

<body>

<h2>FAQ + Schema (AEO SAFE)</h2>

<input id="brand" placeholder="Brand Entity">
<input id="product" placeholder="Tên sản phẩm">

<textarea id="spec" rows="4" placeholder="Đặc tính sản phẩm (SPEC)"></textarea>

<textarea id="faq" rows="10" placeholder="FAQ hiện có (giữ nguyên):
1. Câu hỏi?
Trả lời"></textarea>

<button onclick="run()">Generate</button>

<div class="output" id="out"></div>

<script>
function parseFAQ(text){
  let lines=text.split("\n"),faqs=[],q="",a="";
  for(let line of lines){
    line=line.trim();
    if(line.includes("?")){
      if(q&&a) faqs.push({q,a});
      q=line.replace(/^\d+\.\s*/,"");
      a="";
    }else if(line){
      a+=line+" ";
    }
  }
  if(q&&a) faqs.push({q,a});
  return faqs;
}

function run(){
  let brand=brand.value;
  let product=product.value;
  let spec=spec.value;
  let source=parseFAQ(faq.value);

  // 👉 FAQ mới chuẩn intent + spec
  let gen=[
    {
      q: product+" có đáng mua không?",
      a: product+" là lựa chọn đáng cân nhắc nhờ "+spec
    },
    {
      q: product+" có phù hợp phòng khách không?",
      a: "Phù hợp với không gian phòng khách nhờ thiết kế và kích thước tối ưu."
    },
    {
      q: product+" hoạt động có mượt không?",
      a: "Thiết bị xử lý ổn định, đáp ứng tốt nhu cầu giải trí phổ biến."
    },
    {
      q: product+" có gì nổi bật so với cùng phân khúc?",
      a: "Sản phẩm nổi bật nhờ công nghệ hiển thị và trải nghiệm người dùng."
    },
    {
      q: "Mua "+product+" ở đâu uy tín?",
      a: "Bạn có thể mua "+product+" chính hãng tại "+brand+" để đảm bảo giá tốt và bảo hành đầy đủ."
    }
  ];

  // 👉 HTML chỉ FAQ mới
  let html="";
  gen.forEach(f=>{
    html+=`<div class="faq-generated">
<h4><strong>${f.q}</strong></h4>
<p>${f.a}</p>
</div>\n`;
  });

  // 👉 Schema = FAQ cũ + mới
  let schema={
    "@context":"https://schema.org",
    "@type":"FAQPage",
    "mainEntity":[]
  };

  source.forEach(f=>{
    schema.mainEntity.push({
      "@type":"Question",
      "name":f.q,
      "acceptedAnswer":{"@type":"Answer","text":f.a}
    });
  });

  gen.forEach(f=>{
    schema.mainEntity.push({
      "@type":"Question",
      "name":f.q,
      "acceptedAnswer":{"@type":"Answer","text":f.a}
    });
  });

  let schemaStr=`<script type="application/ld+json">\n${JSON.stringify(schema,null,2)}\n</script>`;

  out.textContent=
  "HTML FAQ MỚI:\n\n"+html+
  "\nSCHEMA:\n\n"+schemaStr;
}
</script>

</body>
</html>
