<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FAQ AEO Tool</title>
<style>
body{font-family:Arial;padding:20px;max-width:1000px;margin:auto}
textarea,input{width:100%;margin:10px 0;padding:10px}
button{padding:10px 15px;margin:5px}
.output{background:#111;color:#0f0;padding:15px;white-space:pre-wrap;margin-top:20px}
</style>
</head>

<body>

<h2>FAQ + Schema (AEO SAFE)</h2>

<input id="brand" placeholder="Brand Entity">
<input id="product" placeholder="Tên sản phẩm">

<textarea id="spec" rows="4" placeholder="Đặc tính sản phẩm"></textarea>

<textarea id="faq" rows="10" placeholder="FAQ hiện có:
1. Câu hỏi?
Trả lời"></textarea>

<button onclick="run()">Generate</button>

<div class="output" id="out"></div>

<script>
function parseFAQ(text){
  let lines = text.split("\\n");
  let faqs = [];
  let q = "", a = "";

  for(let i=0;i<lines.length;i++){
    let line = lines[i].trim();
    if(line.includes("?")){
      if(q && a){
        faqs.push({q:q,a:a});
      }
      q = line.replace(/^\\d+\\.\\s*/, "");
      a = "";
    } else if(line){
      a += line + " ";
    }
  }

  if(q && a){
    faqs.push({q:q,a:a});
  }

  return faqs;
}

function run(){
  let brand = document.getElementById("brand").value;
  let product = document.getElementById("product").value;
  let spec = document.getElementById("spec").value;
  let raw = document.getElementById("faq").value;

  let source = parseFAQ(raw);

  let gen = [
    {
      q: product + " có đáng mua không?",
      a: product + " là lựa chọn đáng cân nhắc nhờ " + spec
    },
    {
      q: product + " có phù hợp phòng khách không?",
      a: "Phù hợp với không gian phòng khách nhờ thiết kế và kích thước tối ưu."
    },
    {
      q: product + " hoạt động có mượt không?",
      a: "Thiết bị xử lý ổn định, đáp ứng tốt nhu cầu giải trí phổ biến."
    },
    {
      q: product + " có gì nổi bật so với cùng phân khúc?",
      a: "Sản phẩm nổi bật nhờ công nghệ hiển thị và trải nghiệm người dùng."
    },
    {
      q: "Mua " + product + " ở đâu uy tín?",
      a: "Bạn có thể mua " + product + " chính hãng tại " + brand + " để đảm bảo giá tốt và bảo hành đầy đủ."
    }
  ];

  let html = "";
  for(let i=0;i<gen.length;i++){
    html += "<div class=\\"faq-generated\\">\\n";
    html += "<h4><strong>" + gen[i].q + "</strong></h4>\\n";
    html += "<p>" + gen[i].a + "</p>\\n";
    html += "</div>\\n";
  }

  let schema = {
    "@context":"https://schema.org",
    "@type":"FAQPage",
    "mainEntity":[]
  };

  for(let i=0;i<source.length;i++){
    schema.mainEntity.push({
      "@type":"Question",
      "name":source[i].q,
      "acceptedAnswer":{
        "@type":"Answer",
        "text":source[i].a
      }
    });
  }

  for(let i=0;i<gen.length;i++){
    schema.mainEntity.push({
      "@type":"Question",
      "name":gen[i].q,
      "acceptedAnswer":{
        "@type":"Answer",
        "text":gen[i].a
      }
    });
  }

  let schemaStr = "<script type=\\"application/ld+json\\">\\n" +
  JSON.stringify(schema,null,2) +
  "\\n</script>";

document.getElementById("out").textContent =
  "HTML FAQ MỚI:\\n\\n" + html +
  "\\nSCHEMA:\\n\\n" + schemaStr;
    "HTML FAQ MỚI:\\n\\n" + html +
    "\\nSCHEMA:\\n\\n" + schemaStr;
}
</script>

</body>
</html>
